name: Build PAL-M 240p
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'overrides/**'
      - '.github/workflows/build.yml'
      - 'README.md'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout MPAL 240p overrides
        uses: actions/checkout@v4
      - name: Fetch Nintendont source
        run: |
          git clone --depth 1 https://github.com/FIX94/Nintendont.git upstream
          (cd overrides && tar cf - .) | (cd upstream && tar xf -)
          grep -q 'TVMpal240Ds' upstream/loader/source/main.c
          grep -q 'VI_TVMODE_MPAL_DS' upstream/kernel/Patch.c
          grep -q 'NIN_SETTINGS_MPAL_240P' upstream/loader/source/menu.c
      - name: Install historical devkitPro toolchain
        run: |
          set -euo pipefail
          mkdir -p /tmp/nin-toolchain
          curl -fLsS --retry 3 'https://wii.leseratte10.de/devkitPro/devkitARM/r53%20(2019-06)/devkitARM-r53-1-linux.pkg.tar.xz' -o /tmp/nin-toolchain/arm.tar.xz
          curl -fLsS --retry 3 'https://wii.leseratte10.de/devkitPro/devkitPPC/r35/devkitPPC-r35-1-linux.pkg.tar.xz' -o /tmp/nin-toolchain/ppc.tar.xz
          curl -fLsS --retry 3 'https://wii.leseratte10.de/devkitPro/libogc/libogc_1.8.23%20(2019-10-02)/libogc-1.8.23-1-any.pkg.tar.xz' -o /tmp/nin-toolchain/libogc.tar.xz
          # Fixed checksums from the toolchain archives actually fetched in run 40863935480.
          echo '140d217a747c21a46236a6675b2592b54397e53c56dd8aa91aaf73bd19fa9599  /tmp/nin-toolchain/arm.tar.xz' | sha256sum -c -
          echo '2916d431913b00d93dd0570d2d650cb1ec13e75422933e0f5726528d6a181658  /tmp/nin-toolchain/ppc.tar.xz' | sha256sum -c -
          echo 'e5b61a2e7589ab95e321cae30bbf1511fbe4729f3120e782201eebf8514c6707  /tmp/nin-toolchain/libogc.tar.xz' | sha256sum -c -
          for archive in /tmp/nin-toolchain/*.tar.xz; do
            sudo tar -xJf "$archive" -C /
          done
      - name: Install matching devkitPPC build rules (missing from compiler archive)
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --branch v1.2.1 https://github.com/devkitPro/devkitppc-rules.git /tmp/devkitppc-rules
          sudo install -m 644 /tmp/devkitppc-rules/wii_rules /tmp/devkitppc-rules/base_rules /tmp/devkitppc-rules/base_tools /opt/devkitpro/devkitPPC/
          ls -l /opt/devkitpro/devkitPPC/{wii_rules,base_rules,base_tools}
          ls -l /opt/devkitpro/tools/bin/elf2dol /opt/devkitpro/devkitPPC/bin/powerpc-eabi-gcc || true
      - name: Install general-tools and gamecube-tools for bin2s and elf2dol
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 'https://wii.leseratte10.de/devkitPro/other-stuff/general-tools/general-tools-1.2.0-1-linux.pkg.tar.xz' -o /tmp/nin-toolchain/general-tools.tar.xz
          curl -fLsS --retry 3 'https://wii.leseratte10.de/devkitPro/other-stuff/gamecube-tools/gamecube-tools-1.0.2-1-linux.pkg.tar.xz' -o /tmp/nin-toolchain/gamecube-tools.tar.xz
          echo "Binary archive entries:"
          tar -tJf /tmp/nin-toolchain/general-tools.tar.xz | grep -E 'bin2s|elf2dol|/bin/' || true
          tar -tJf /tmp/nin-toolchain/gamecube-tools.tar.xz | grep -E 'bin2s|elf2dol|/bin/' || true
          sudo tar -xJf /tmp/nin-toolchain/general-tools.tar.xz -C /
          sudo tar -xJf /tmp/nin-toolchain/gamecube-tools.tar.xz -C /
          echo "Installed tool binaries:"
          find /opt/devkitpro -type f \( -name bin2s -o -name elf2dol \) -print
          test -x /opt/devkitpro/tools/bin/bin2s
          test -x /opt/devkitpro/tools/bin/elf2dol
      - name: Compile Nintendont
        working-directory: upstream
        env:
          DEVKITPRO: /opt/devkitpro
          DEVKITARM: /opt/devkitpro/devkitARM
          DEVKITPPC: /opt/devkitpro/devkitPPC
        run: |
          set -euo pipefail
          export PATH="$DEVKITARM/bin:$DEVKITPPC/bin:$PATH"
          make -j2
          test -s loader/loader.dol
      - name: Package boot.dol
        run: |
          mkdir -p artifact
          cp upstream/loader/loader.dol artifact/boot.dol
          echo "Experimental: PAL-M 240p. Not tested on real Wii hardware." > artifact/NOTICE.txt
      - name: Upload experimental homebrew
        uses: actions/upload-artifact@v4
        with:
          name: Nintendont-MPAL-240p-experimental
          path: artifact/
          if-no-files-found: error
